name: SAMVIL Release Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python package
        run: |
          python3 -m venv mcp/.venv
          mcp/.venv/bin/python -m pip install --upgrade pip wheel
          mcp/.venv/bin/python -m pip install \
            -e mcp \
            pytest==9.1.1 \
            pytest-asyncio==1.4.0 \
            iniconfig==2.3.0 \
            packaging==26.2 \
            pluggy==1.6.0 \
            pygments==2.20.0 \
            typing-extensions==4.16.0

      - name: Run portable release-control contract suite
        run: |
          set -euo pipefail
          umask 077

          invocation_root="$(mktemp -d "${RUNNER_TEMP}/samvil-release-control.XXXXXX")"
          test_home="${invocation_root}/home"
          test_codex_home="${invocation_root}/codex-home"
          test_tmpdir="${invocation_root}/tmp"
          test_xdg_cache="${invocation_root}/xdg/cache"
          test_xdg_config="${invocation_root}/xdg/config"
          test_xdg_data="${invocation_root}/xdg/data"
          test_xdg_state="${invocation_root}/xdg/state"
          test_gitconfig="${invocation_root}/gitconfig"

          mkdir -p \
            "${test_home}" \
            "${test_codex_home}" \
            "${test_tmpdir}" \
            "${test_xdg_cache}" \
            "${test_xdg_config}" \
            "${test_xdg_data}" \
            "${test_xdg_state}"
          : > "${test_gitconfig}"

          export HOME="${test_home}"
          export CODEX_HOME="${test_codex_home}"
          export TMPDIR="${test_tmpdir}"
          export XDG_CACHE_HOME="${test_xdg_cache}"
          export XDG_CONFIG_HOME="${test_xdg_config}"
          export XDG_DATA_HOME="${test_xdg_data}"
          export XDG_STATE_HOME="${test_xdg_state}"
          export GIT_CONFIG_GLOBAL="${test_gitconfig}"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_TERMINAL_PROMPT=0
          export PYTHONNOUSERSITE=1
          export PYTHONDONTWRITEBYTECODE=1
          export SAMVIL_PINNED_RUNTIME_SOURCE="${pythonLocation}"
          export SAMVIL_REQUIRE_COMPLETE_RELEASE_CONTROL=1

          mcp/.venv/bin/python -B tools/release-control/tests/test_release_control.py

      - name: Install browser runtime
        run: npx --yes playwright@1.52.0 install --with-deps chromium

      - name: Run release check runner
        run: |
          set -o pipefail
          mcp/.venv/bin/python scripts/run-release-checks.py --format json | tee /tmp/samvil-release-runner.json

      - name: Build release evidence bundle
        run: |
          set -o pipefail
          mcp/.venv/bin/python scripts/build-release-bundle.py --format json | tee /tmp/samvil-release-bundle.json

      - name: Collect release artifacts
        if: always()
        run: |
          mkdir -p .samvil/ci-artifacts
          cp .samvil/release-report.json .samvil/ci-artifacts/release-report.json 2>/dev/null || true
          cp .samvil/release-summary.md .samvil/ci-artifacts/release-summary.md 2>/dev/null || true
          cp /tmp/samvil-release-runner.json .samvil/ci-artifacts/release-runner.json 2>/dev/null || true
          cp /tmp/samvil-release-bundle.json .samvil/ci-artifacts/release-bundle.json 2>/dev/null || true

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samvil-release-evidence
          if-no-files-found: warn
          path: |
            .samvil/ci-artifacts/release-report.json
            .samvil/ci-artifacts/release-summary.md
            .samvil/ci-artifacts/release-runner.json
            .samvil/ci-artifacts/release-bundle.json
