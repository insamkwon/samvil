[project]
name = "samvil-mcp"
version = "1.0.0"
description = "SAMVIL MCP Server — session persistence, evaluation history, and evolve convergence for the AI vibe-coding harness."
requires-python = ">=3.12"
authors = [{ name = "insam" }]
license = { text = "UNLICENSED" }
dependencies = [
    # mcp 2.0 removed the `mcp.server.fastmcp` module path — pin <2 until server.py migrates.
    "mcp[cli]>=1.0.0,<2",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Fresh-clone contributors: `pip install -e ".[test]"` then `pytest tests/`.
# pytest-asyncio was previously undeclared — tests failed at collection on
# a clean venv (found in the v4.30.0 fresh-clone verification).
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
samvil-mcp = "samvil_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
